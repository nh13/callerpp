name: Compilation Check

on: [push]

env:
  PYTHON_VERSION: 3.11

jobs:
  Tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout callerpp
        uses: actions/checkout@v4

      - name: Checkout spoa
        uses: actions/checkout@v4
        with:
          repository: rvaser/spoa
          path: spoa

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev

      - name: Install the spoa library
        shell: bash -l {0}
        run: |
          pushd spoa
          cmake -B build -DCMAKE_BUILD_TYPE=Release spoa_install spoa_optimize_for_portability
          sudo make -C build install
          popd

      - name: Test spoa
        shell: bash -l {0}
        run: |
          spoa --version

      - name: Build callerpp
        shell: bash -l {0}
        run: |
          make

      - name: Run unit tests
        shell: bash -l {0}
        run: |
          make test

      - name: Test callerpp CLI
        shell: bash -l {0}
        run: |
          ./bin/callerpp -v
          ./bin/callerpp --version
          printf ">1\nAAAAAGAAAAA\nAAAAACAAAAA\nAAAAAGAAAAA"| ./bin/callerpp -a 2
